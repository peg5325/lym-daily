spring:
  application:
    name: formom-daily

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:formom}?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
        show_sql: true
    open-in-view: false

  # Scheduler
  task:
    scheduling:
      pool:
        size: 5

# Logging
logging:
  level:
    com.formom.daily: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# API Keys (from environment variables)
naver:
  api:
    client-id: ${NAVER_API_KEY}
    client-secret: ${NAVER_API_SECRET}
  search:
    keyword: "임영웅"
    count: 10

youtube:
  api:
    key: ${YOUTUBE_API_KEY}
  channel:
    official:
      - "UCxxxxxxxxxxxxxxxx"  # 공식 채널 ID (추후 업데이트)
  fetch:
    count: 5

openai:
  api:
    key: ${OPENAI_API_KEY}
  model: "gpt-3.5-turbo"
  max-tokens: 100
  temperature: 0.3

# Scheduler
scheduler:
  cron: "0 0 7 * * *"  # 매일 오전 7시
  retry:
    max-attempts: 3
    delay-ms: 5000

# Cache
cache:
  today-summary-ttl-minutes: 60
  past-data-ttl-hours: 24
